<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creator Signal</title>
<style>
:root{--bg:#000;--card:rgba(22,22,25,.88);--ink:#f5f5f7;--mute:#aeaeb6;--line:rgba(255,255,255,.13);--accent:#f5f5f7;--accent-soft:rgba(255,255,255,.1);
--want:#2ecc8a;--hesitant:#f0aa3c;--critical:#f05a5a;--unclear:#7d8aa0;--offtopic:rgba(255,255,255,.14);--radius:22px;
--mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,"PingFang SC","Microsoft YaHei",Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
#batch,#detail,#compare,#comments,#method{scroll-margin-top:76px}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans)}
#code{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;image-rendering:pixelated;image-rendering:crisp-edges;opacity:.4}
.veil{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 80% 90% at 50% 30%,rgba(0,0,0,.9),rgba(0,0,0,0) 100%)}
header,main{position:relative;z-index:1}
a{color:var(--ink);text-decoration:underline;text-decoration-color:rgba(255,255,255,.3);text-underline-offset:3px}a:hover{text-decoration-color:#fff}
header{position:sticky;top:0;z-index:5;background:rgba(0,0,0,.55);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.wrap{max-width:1220px;margin:0 auto;padding:0 24px}
.top{display:flex;align-items:center;justify-content:space-between;height:58px;gap:12px}
.brand{font:600 15px var(--mono);letter-spacing:.02em;display:flex;align-items:center;gap:9px}.brand i{width:14px;height:14px;background:conic-gradient(#fff 25%,transparent 0 50%,#fff 0 75%,transparent 0);display:block}.brand span{color:var(--mute)}
.top nav{display:flex;align-items:center;gap:18px}
.top nav a{color:var(--mute);font-size:13.5px;text-decoration:none}.top nav a:hover{color:var(--ink)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;font:12px var(--mono)}
.lang button{background:none;border:0;color:var(--mute);padding:5px 11px}
.lang button.on{background:#f5f5f7;color:#000}
@media(max-width:720px){.top nav a{display:none}}
main{padding:72px 0 90px}
.prompt{font:13px var(--mono);color:var(--ink);margin-bottom:18px;opacity:.85}
.prompt b{color:var(--mute);font-weight:400}
h1{font-size:52px;font-weight:600;line-height:1.08;margin:0 0 18px;letter-spacing:-.035em;max-width:860px}
h1 .cur{display:inline-block;width:.42em;height:.82em;background:#f5f5f7;margin-left:6px;vertical-align:-.08em;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media(max-width:720px){h1{font-size:34px}}
h2{font-size:17px;margin:0 0 16px;font-weight:600;letter-spacing:-.01em}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.hrow h2{margin:0}
.ghost{border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:999px;padding:5px 14px;font-size:13px;white-space:nowrap}.ghost:hover{background:rgba(255,255,255,.14)}
.sub{color:#d1d1d6;margin:0 0 16px;max-width:680px;font-size:18px;line-height:1.5}
.by{font:13px var(--mono);color:var(--mute);margin:0 0 40px}.by a{color:var(--ink)}
.card{background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:var(--radius);padding:26px;margin-bottom:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.row{display:flex;gap:10px;flex-wrap:wrap}
input[type=text],input[type=password]{flex:1;min-width:240px;height:46px;border:1px solid var(--line);border-radius:14px;padding:0 16px;font:15px var(--sans);background:rgba(0,0,0,.35);color:var(--ink)}
input.fee{flex:none;min-width:0;width:78px;height:30px;border-radius:8px;padding:0 8px;font:13px var(--mono);text-align:right}
input[type=text]::placeholder,input[type=password]::placeholder{color:#6e6e76}
input[type=text]:focus,input[type=password]:focus{outline:3px solid rgba(255,255,255,.14);border-color:rgba(255,255,255,.5)}
button{font:inherit;cursor:pointer;color:inherit}
.btn{height:46px;padding:0 26px;border:0;border-radius:999px;background:#f5f5f7;color:#000;font-weight:600}
.btn:hover{background:#fff}
.msg{margin-top:10px;font-size:14px;color:var(--mute);min-height:20px}
.quota{font:12.5px var(--mono);color:var(--mute)}
.imp{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;color:var(--mute)}
.drag .card:first-of-type{outline:2px dashed rgba(255,255,255,.5)}
.bsum{display:flex;gap:18px;flex-wrap:wrap;font-size:14.5px;margin-bottom:14px}.bsum b{font-weight:600}
.bmap{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--mute);margin-bottom:14px}
select{height:34px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--ink);font:14px var(--sans);padding:0 8px;max-width:220px}
.bbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.bbtns .btn{height:40px}.btn:disabled{opacity:.35;cursor:default}
.bscroll{max-height:380px;overflow:auto;border:1px solid var(--line);border-radius:14px}
.bscroll table{font-size:14px}.bscroll th{position:sticky;top:0;background:#1b1b1e;cursor:default;text-align:left}.bscroll td{text-align:left;padding:9px 10px;cursor:default}
.bscroll tbody tr{cursor:default}.bscroll td.u{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:12.5px var(--mono);color:var(--mute)}
.st{white-space:nowrap}.st.done,.st.have{color:#63e2ab}.st.error{color:#ff9c9c}.st.running{color:#f3bd63}.st.dup,.st.channel,.st.platform,.st.ytother{color:var(--mute)}
.prog{height:4px;border-radius:2px;background:rgba(255,255,255,.1);margin-top:14px;overflow:hidden}.prog i{display:block;height:100%;background:#f5f5f7;transition:width .3s}
.notice{background:rgba(240,170,60,.1);border:1px solid rgba(240,170,60,.35);color:#f3c77e;border-radius:8px;padding:10px 14px;font-size:14px;margin-bottom:16px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font:600 11px var(--sans);color:var(--mute);text-transform:uppercase;letter-spacing:.02em;text-align:right;padding:8px 7px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}th:hover{color:var(--ink)}
td{padding:13px 7px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
tbody tr{cursor:pointer}tbody tr:hover{background:rgba(255,255,255,.03)}tbody tr.on{background:rgba(255,255,255,.09)}
tbody tr:last-child td{border-bottom:0}
td .t{color:var(--mute);font-size:12.5px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scroll{overflow-x:auto}
.vhead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.vhead h3{font-size:26px;font-weight:600;margin:0 0 6px;letter-spacing:-.02em}
.verdict{margin-top:18px;padding:16px 18px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:17px;line-height:1.5}.verdict span{display:block;font:500 11px var(--mono);color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.meta{color:var(--mute);font-size:14px}
.badge{display:inline-block;font:500 11.5px var(--mono);padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.12);color:#e5e5ea;margin-left:8px;vertical-align:middle}
.badge.warn{background:rgba(240,90,90,.15);color:#ff9c9c}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute);white-space:nowrap}
.toggle input{accent-color:#f5f5f7}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:18px}
.tile{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:16px;padding:16px 18px;text-align:left;transition:background .15s,transform .15s}
button.tile:hover{background:rgba(255,255,255,.11);transform:translateY(-1px)}
.tile .k{font:500 11px var(--mono);color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.tile .v{font:600 32px var(--sans);letter-spacing:-.03em;margin:4px 0 2px;line-height:1.2;font-variant-numeric:tabular-nums}
.tile .v.txt{font:600 16px var(--sans);letter-spacing:0;line-height:1.3;padding:7px 0}
.tile .d{font-size:12.5px;color:var(--mute)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.stack{display:flex;height:14px;border-radius:999px;overflow:hidden;margin-bottom:12px;gap:2px}
.stack button{border:0;padding:0;height:100%}
.legend{display:grid;gap:2px}
.lg,.bar{width:100%;background:none;border:0;padding:6px;border-radius:6px;text-align:left;font-size:14px}
.lg{display:flex;align-items:center;gap:8px}
.lg:hover,.bar:hover{background:rgba(255,255,255,.05)}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.lg .n,.bar .n{margin-left:auto;color:var(--mute);font:13px var(--mono)}
.bar{display:grid;grid-template-columns:170px 1fr 40px;gap:10px;align-items:center}
.bar i{display:block;height:6px;border-radius:3px;background:#f5f5f7}
.bar .n{text-align:right}
.empty{color:var(--mute);font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:999px;padding:5px 13px;font-size:13px}
.chip:hover{background:rgba(255,255,255,.14)}
.chip.on{background:#f5f5f7;border-color:#f5f5f7;color:#000}
.health{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.health b{display:block;font:600 24px var(--sans);letter-spacing:-.02em}.health span{font-size:12.5px;color:var(--mute)}
.cm{padding:13px 0;border-bottom:1px solid var(--line)}
.cm:last-of-type{border-bottom:0}
.cm p{margin:0 0 7px;font-size:15.5px;line-height:1.6;max-width:820px;white-space:pre-wrap;overflow-wrap:anywhere}
.tags{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--mute);align-items:center}
.tag{padding:1px 8px;border-radius:999px;background:rgba(255,255,255,.07);color:#b9c3d3}
.tag.want{background:rgba(46,204,138,.15);color:#63e2ab}.tag.hesitant{background:rgba(240,170,60,.15);color:#f3bd63}.tag.critical{background:rgba(240,90,90,.15);color:#ff9c9c}
mark{background:rgba(255,214,90,.22);color:inherit;padding:0 2px;border-radius:2px}
.more{margin-top:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:999px;padding:8px 16px}
.more:hover{background:rgba(255,255,255,.14)}
.method{color:#c7c7cc;font-size:14.5px}.method ul{margin:0;padding-left:20px}.method li{margin-bottom:7px}
footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--mute);font:12.5px var(--mono);margin-top:28px;padding-top:18px;border-top:1px solid var(--line)}
footer a{color:var(--ink)}
</style>
</head>
<body>
<canvas id="code" aria-hidden="true"></canvas><div class="veil"></div>
<header><div class="wrap top">
  <div class="brand"><i></i>Creator Signal</div>
  <nav>
    <a href="#compare" data-i="navCompare"></a><a href="#detail" data-i="navDetail"></a><a href="#method" data-i="navMethod"></a>
    <div class="lang"><button data-lang="en">EN</button><button data-lang="zh">中文</button></div>
  </nav>
</div></header>
<main><div class="wrap">
  <div class="prompt"><b>$</b> creator-signal --read comments --under sponsored-video</div>
  <h1><span data-i="h1"></span><span class="cur"></span></h1>
  <p class="sub" data-i="sub"></p>
  <p class="by"><span data-i="by"></span> Yuhan Liu · <a href="mailto:iamyuhanliu@gmail.com">iamyuhanliu@gmail.com</a></p>
  <div id="notice"></div>
  <div class="card">
    <div class="row">
      <input type="text" id="url" autocomplete="off">
      <button class="btn" id="go" data-i="analyse"></button>
    </div>
    <div class="row" id="pwrow" hidden style="margin-top:10px"><input type="password" id="pw" autocomplete="off"><button class="ghost" id="pwok" data-i="pwSave"></button></div>
    <div class="chips" id="samples"></div>
    <div class="msg" id="msg"></div>
    <div class="quota" id="quota"></div>
    <div class="imp"><button class="ghost" id="imp" data-i="impBtn"></button><span data-i="impHint"></span><input type="file" id="file" accept=".xlsx,.xls,.csv,.tsv,.txt" hidden></div>
  </div>
  <div id="batch"></div>
  <div class="card" id="compare">
    <div class="hrow"><h2 data-i="compareTitle"></h2><button class="ghost" id="csv1" data-i="exportTable"></button></div>
    <div class="scroll"><table><thead><tr id="heads"></tr></thead><tbody id="rows"></tbody></table></div>
  </div>
  <div id="detail"></div>
  <div class="card method" id="method"><h2 data-i="methodTitle"></h2><ul id="methodList"></ul></div>
  <footer><span><span data-i="by"></span> Yuhan Liu · <a href="mailto:iamyuhanliu@gmail.com">iamyuhanliu@gmail.com</a></span><span id="foot"></span></footer>
</div></main>

<script src="data.js"></script>
<script src="config.js"></script>

let PW = ''; try { PW = sessionStorage.getItem('cs-pw') || ''; } catch (e) {}
try { JSON.parse(localStorage.getItem('cs-added') || '[]').forEach(v => { if (v && v.id && Array.isArray(v.comments) && !D.videos.some(x => x.id === v.id)) D.videos.push(v); }); } catch (e) {}
function saveAdded() { try { localStorage.setItem('cs-added', JSON.stringify(D.videos.filter(v => v.live).slice(-40))); } catch (e) {} }
const I = {

/* 背景：像素抖动的流动纹理 */
(function () {
  const cv = document.getElementById('code'); if (!cv || !cv.getContext) return;
  const ctx = cv.getContext('2d'), CELL = 7, B = [0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
  const still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  let cols = 0, rows = 0, img = null, t = 0, last = 0;
  function h(x, y) { let n = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) | 0; n = Math.imul(n ^ (n >>> 13), 1274126177); return ((n ^ (n >>> 16)) >>> 0) / 4294967296; }
  function noise(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), w = yf * yf * (3 - 2 * yf);
    const a = h(xi, yi), b = h(xi + 1, yi), c = h(xi, yi + 1), d = h(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * w + (a - b - c + d) * u * w;
  }
  function setup() { cols = Math.ceil(innerWidth / CELL); rows = Math.ceil(innerHeight / CELL); cv.width = cols; cv.height = rows; img = ctx.createImageData(cols, rows); draw(); }
  function draw() {
    const d = img.data, ca = Math.cos(-.5), sa = Math.sin(-.5);
    for (let y = 0, p = 0; y < rows; y++) for (let x = 0; x < cols; x++, p += 4) {
      const u = x * ca - y * sa, v = x * sa + y * ca;
      let n = noise(u * .022 - t * .22, v * .085) * .62 + noise(u * .06 - t * .5, v * .2 + 9.3) * .38;
      n = Math.max(0, Math.min(1, (n - .42) * 2.6));
      const dx = Math.abs(x / cols - .5) * 2, edge = .04 + .96 * Math.max(0, Math.min(1, (dx - .62) * 3));
      const val = n * edge, on = val * 16 > B[(x & 3) + (y & 3) * 4] + .5, g = on ? 60 + val * 150 : 0;
      d[p] = d[p + 1] = d[p + 2] = g; d[p + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
  }
  function tick(now) { if (now - last > 42) { t += Math.min((now - last) / 1000, .1) * .45; last = now; draw(); } requestAnimationFrame(tick); }
  addEventListener('resize', setup); t = 3; setup();
  if (!still) requestAnimationFrame(n => { last = n; requestAnimationFrame(tick); });
})();
</script>
